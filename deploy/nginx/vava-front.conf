log_format vava_front '$remote_addr - - [$time_local] '
                      'host="$host" sni="$ssl_server_name" server="$server_name" '
                      '"$request" $status $body_bytes_sent '
                      'referer="$http_referer" ua="$http_user_agent"';

upstream vava_fastapi {
    server 127.0.0.1:18080;
    keepalive 32;
}

upstream vava_legacy_https {
    server 127.0.0.1:18443;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name .sunvalleycloud.com .vava.com;

    ssl_certificate     /opt/vava-server/legacy/sunvalley_multi_san_fullchain.crt;
    ssl_certificate_key /opt/vava-server/legacy/sunvalley_multi_san.key;

    # The base station uses an old TLS stack, so the front door must stay permissive.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ALL:@SECLEVEL=0;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:VAVA_SSL:10m;

    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_intercept_errors on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    access_log /var/log/nginx/vava-front.access.log vava_front;
    error_log  /var/log/nginx/vava-front.error.log info;

    # Default: send everything to FastAPI first.
    # If FastAPI returns 404, fall back to the legacy compatibility service.
    error_page 404 = @legacy_fallback;

    location / {
        proxy_pass http://vava_fastapi;
    }

    location @legacy_fallback {
        proxy_ssl_server_name off;
        proxy_ssl_verify off;
        proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        proxy_ssl_ciphers ALL:@SECLEVEL=0;
        proxy_pass https://vava_legacy_https;
    }
}
